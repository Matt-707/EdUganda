<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generate Exam Paper</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body class="bg-slate-50 min-h-screen flex items-center justify-center p-6">
    <div
      class="bg-white rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100 p-10 max-w-xl w-full space-y-8 relative overflow-hidden"
    >
      <div class="text-center space-y-2">
        <h1 class="text-3xl font-bold text-emerald-900 tracking-tight">
          Generate Paper
        </h1>
        <p class="text-slate-500 text-sm">
          Configure your UNEB Physics parameters
        </p>
      </div>

      <form method="post" class="space-y-6" onsubmit="showSpinner()">
        {% csrf_token %}
        <div class="text-slate-700">{{ form.as_p }}</div>
        <button
          type="submit"
          class="w-full bg-emerald-900 hover:bg-emerald-800 text-amber-400 font-semibold py-3 px-4 rounded-xl shadow-md transition-all hover:shadow-lg transform hover:-translate-y-0.5"
        >
          Generate Document
        </button>
      </form>

      <!-- Spinner Overlay -->
      <div
        id="spinner"
        class="hidden absolute inset-0 bg-white/80 backdrop-blur-sm flex items-center justify-center z-10"
      >
        <div
          class="animate-spin rounded-full h-10 w-10 border-2 border-slate-200 border-t-emerald-800"
        ></div>
      </div>

      <div class="text-center pt-4 border-t border-slate-100">
        <a
          href="{% url 'ask_ai' %}"
          class="inline-block text-xs font-semibold text-slate-400 hover:text-emerald-700 uppercase tracking-wider transition-colors"
        >
          Return to Assistant
        </a>
      </div>
    </div>

    <script>
      function showSpinner() {
        document.getElementById("spinner").classList.remove("hidden");
      }
    </script>
  </body>
</html>
